name: release
on:
  push:
    tags: ['main']
permissions:
  contents: write
  packages: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build MSIX
        run: dotnet build src/Astrolabe.App/Astrolabe.App.csproj -c Release
      - name: Build Portable
        run: dotnet publish src/Astrolabe.FolderPalette/Astrolabe.FolderPalette.PortableExe/Astrolabe.FolderPalette.PortableExe.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:PublishTrimmed=true
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src/Astrolabe.App/AppPackages/**/*.msix
            src/Astrolabe.FolderPalette/Astrolabe.FolderPalette.PortableExe/bin/Release/**/*.exe